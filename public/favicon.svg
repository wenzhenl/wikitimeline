<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Brighter blue gradient background -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
  </defs>
  
  <!-- White square background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" fill="white" rx="64" ry="64" />
  
  <!-- Blue rounded square for the main background - expanded to fill more space -->
  <rect x="8" y="8" width="496" height="496" fill="url(#blueGradient)" rx="56" ry="56" />
  
  <!-- Simplified and bolder vertical bars (fewer but thicker) - expanded to fill more space -->
  <!-- Left side -->
  <rect x="106" y="176" width="40" height="190" fill="#ffffff" rx="4" ry="4" />
  <rect x="176" y="156" width="40" height="210" fill="#ffffff" rx="4" ry="4" />
  
  <!-- Center bar (taller and wider) -->
  <rect x="236" y="126" width="40" height="240" fill="#ffffff" rx="4" ry="4" />
  
  <!-- Right side -->
  <rect x="296" y="156" width="40" height="210" fill="#ffffff" rx="4" ry="4" />
  <rect x="366" y="176" width="40" height="190" fill="#ffffff" rx="4" ry="4" />
  
  <!-- Photo frames with bolder stroke (first and last are smaller like "i" dots) -->
  <rect x="111" y="106" width="30" height="30" rx="3" ry="3" stroke="#ffffff" stroke-width="6" fill="none" />
  <rect x="231" y="76" width="50" height="40" rx="3" ry="3" stroke="#ffffff" stroke-width="6" fill="none" />
  <rect x="371" y="106" width="30" height="30" rx="3" ry="3" stroke="#ffffff" stroke-width="6" fill="none" />
  
  <!-- Horizontal baseline (thicker) -->
  <line x1="86" y1="386" x2="426" y2="386" 
        stroke="#ffffff" stroke-width="6" />
        
  <!-- Dots aligned with bars, with different colors and larger -->
  <circle cx="126" cy="386" r="9" fill="#FFD54F" /> <!-- Yellow -->
  <circle cx="196" cy="386" r="9" fill="#FF7043" /> <!-- Orange -->
  <circle cx="256" cy="386" r="9" fill="#E91E63" /> <!-- Pink -->
  <circle cx="316" cy="386" r="9" fill="#9C27B0" /> <!-- Purple -->
  <circle cx="386" cy="386" r="9" fill="#4CAF50" /> <!-- Green -->
</svg> 