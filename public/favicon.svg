<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Brighter blue gradient background -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
  </defs>
  
  <!-- White square background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" fill="white" rx="64" ry="64" />
  
  <!-- Blue rounded square for the main background -->
  <rect x="16" y="16" width="480" height="480" fill="url(#blueGradient)" rx="48" ry="48" />
  
  <!-- Simplified and bolder vertical bars (fewer but thicker) -->
  <!-- Left side -->
  <rect x="126" y="196" width="30" height="170" fill="#ffffff" rx="3" ry="3" />
  <rect x="186" y="176" width="30" height="190" fill="#ffffff" rx="3" ry="3" />
  
  <!-- Center bar (taller and wider) -->
  <rect x="241" y="146" width="30" height="220" fill="#ffffff" rx="3" ry="3" />
  
  <!-- Right side -->
  <rect x="296" y="176" width="30" height="190" fill="#ffffff" rx="3" ry="3" />
  <rect x="356" y="196" width="30" height="170" fill="#ffffff" rx="3" ry="3" />
  
  <!-- Simplified photo frames (just one prominent one) -->
  <rect x="231" y="96" width="50" height="40" rx="3" ry="3" stroke="#ffffff" stroke-width="4" fill="none" />
  
  <!-- Horizontal baseline (thicker) -->
  <line x1="106" y1="366" x2="406" y2="366" 
        stroke="#ffffff" stroke-width="5" />
        
  <!-- Fewer but larger dots -->
  <circle cx="156" cy="366" r="6" fill="#ffffff" />
  <circle cx="206" cy="366" r="6" fill="#ffffff" />
  <circle cx="256" cy="366" r="6" fill="#ffffff" />
  <circle cx="306" cy="366" r="6" fill="#ffffff" />
  <circle cx="356" cy="366" r="6" fill="#ffffff" />
</svg> 